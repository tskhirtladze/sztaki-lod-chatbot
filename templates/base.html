<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SZTAKI LOD{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>

<nav id="navbar">

    <a class="nav-logo" href="/">
        <div class="nav-logo-icon">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 stroke-linecap="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v4M12 18v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M2 12h4M18 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
            </svg>
        </div>

        <div class="nav-logo-text">
            SZTAKI LOD
            <span>Hungarian Cultural Heritage</span>
        </div>
    </a>

    <div class="nav-tabs">

        <a href="/"
           class="nav-tab {% block chat_active %}{% endblock %}">
            Chat
        </a>

        <a href="/graph"
           class="nav-tab {% block graph_active %}{% endblock %}">
            Knowledge Graph
        </a>

    </div>

    <div class="nav-spacer"></div>

    <div class="nav-status">
        <span class="status-dot"></span>
        Live
    </div>

    {% block nav_actions %}{% endblock %}

</nav>

{% block content %}{% endblock %}

{% block scripts %}{% endblock %}

</body>
</html>
