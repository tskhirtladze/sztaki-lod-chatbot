<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NDA Explorer{% endblock %}</title>
<meta name="description" content="Ask questions about Hungary's National Digital Archive - books, radio programmes, photographs and films, linked to their creators and subjects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">NDA</span>
        <span class="brand-name">Explorer</span>
    </a>
    <nav class="site-nav">
        <a href="{{ url_for('index') }}" class="{{ 'active' if active == 'chat' else '' }}">Ask</a>
        <a href="{{ url_for('graph') }}" class="{{ 'active' if active == 'graph' else '' }}">Explore graph</a>
        <a href="{{ url_for('about') }}" class="{{ 'active' if active == 'about' else '' }}">About</a>
    </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
