{% extends "base.html" %}
{% block title %}Explore graph · NDA Explorer{% endblock %}
{% block content %}
<div class="graph-shell">

    <aside class="graph-panel panel-left">
        <div class="panel-header">
            <p class="panel-title">Search &amp; filter</p>
            <input
                class="search-input"
                id="search-input"
                type="text"
                placeholder="Search nodes by name…"
                oninput="filterNodes()"
            >
        </div>
        <div class="filter-row">
            <button class="filter-chip active" data-type="work" onclick="toggleFilter(this)">
                <span class="dot" style="background:#B9720F"></span>Works
            </button>
            <button class="filter-chip active" data-type="person" onclick="toggleFilter(this)">
                <span class="dot" style="background:#2A4B7C"></span>People
            </button>
            <button class="filter-chip active" data-type="sound" onclick="toggleFilter(this)">
                <span class="dot" style="background:#1F8A6F"></span>Audio
            </button>
            <button class="filter-chip active" data-type="concept" onclick="toggleFilter(this)">
                <span class="dot" style="background:#7C5CB0"></span>Subjects
            </button>
            <button class="filter-chip active" data-type="series" onclick="toggleFilter(this)">
                <span class="dot" style="background:#B23A48"></span>Series
            </button>
            <button class="filter-chip active" data-type="other" onclick="toggleFilter(this)">
                <span class="dot" style="background:#7A7566"></span>Other
            </button>
        </div>
        <div class="node-list" id="node-list">
            <div class="list-empty">Loading…</div>
        </div>
    </aside>

    <div class="canvas-wrap" id="canvas-wrap">
        <div class="graph-stats">
            <div class="graph-stat"><strong id="stat-nodes">0</strong> nodes</div>
            <div class="graph-stat"><strong id="stat-edges">0</strong> links</div>
            <div class="graph-stat" id="stat-selected" style="display:none">Viewing <strong id="stat-sel-label"></strong></div>
        </div>

        <div class="graph-toolbar">
            <button class="btn-icon" title="Zoom in" onclick="zoomBy(1.25)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
            </button>
            <button class="btn-icon" title="Zoom out" onclick="zoomBy(0.8)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
            </button>
            <button class="btn-icon" title="Reset layout" onclick="resetLayout()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3M21 4v5h-5"/></svg>
            </button>
            <button class="btn-icon" id="btn-expand" title="Zoom to fit" onclick="toggleExpand()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
            <button class="btn-icon" id="btn-fullscreen" title="Fullscreen" onclick="toggleCanvasFullscreen()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
        </div>

        <canvas id="graph-canvas"></canvas>

        <div class="node-tooltip" id="node-tooltip">
            <div id="tt-title"></div>
            <div id="tt-type"></div>
            <div id="tt-props"></div>
        </div>

        <div class="graph-loading" id="graph-loading">
            <div class="graph-loading-inner">
                <div class="loading-spinner"></div>
                Loading a sample of the graph…
            </div>
        </div>
    </div>

    <aside class="graph-panel panel-right detail-panel empty" id="detail-panel">
        <div class="detail-empty-state">
            Click any node to see its properties and connections here.
        </div>
        <div class="detail-content" id="detail-content"></div>
    </aside>

</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/graph.js') }}"></script>
{% endblock %}
